[package]
name = "appimage-thumbnailer"
version = "5.0.0"
edition = "2024"
rust-version = "1.90"
description = "freedesktop.org thumbnailer for AppImages"
license = "MIT"
repository = "https://github.com/kem-a/appimage-thumbnailer"
publish = false

[features]
default = ["shadow"]
# Soft drop shadow beneath the icon
shadow = []

[dependencies]
backhand = { version = "0.25.5", default-features = false, features = ["gzip", "xz", "xz-static", "zstd", "lz4", "error-strings"] }
dwarfs = { version = "0.2.1", default-features = false, features = ["zstd", "lzma", "lz4"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
positioned-io = "0.3.5"
resvg = "0.50.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
